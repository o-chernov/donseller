# Donseller: HTTPS-вход для donseller.mywayis.com → приложение на 127.0.0.1:8001.
# Порт 80 (проверки Let's Encrypt и редирект на HTTPS) обслуживает сервер по умолчанию.
# Смена домена: server_name и пути к сертификату ниже, плюс адреса в .env.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name donseller.mywayis.com;

    # Сертификат Let's Encrypt (продлевается автоматически)
    ssl_certificate     /etc/letsencrypt/live/donseller.mywayis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donseller.mywayis.com/privkey.pem;

    # Отвечаем только своему домену: запросы с чужим Host или по IP сбрасываем.
    # Если добавите второе имя в server_name — пересмотрите эту проверку.
    if ($host != $server_name) {
        return 444;
    }

    # Общие заголовки безопасности (HSTS, nosniff, X-Frame-Options, Referrer-Policy).
    # Если в location появится свой add_header — подключить сниппет и там.
    include snippets/security-headers.conf;

    access_log /var/log/nginx/donseller.access.log main;
    error_log  /var/log/nginx/donseller.error.log;

    # Всё — в приложение. Заголовки прокси, WebSocket и таймауты — из общего сниппета
    location / {
        proxy_pass http://127.0.0.1:8001;
        include snippets/proxy.conf;
    }
}
