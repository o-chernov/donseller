# CI/CD Donseller.
#   push в dev  — сборка образа (проверка, что собирается); ничего не публикуется.
#   push в main — сборка → ghcr.io → деплой на сервер (там его выполняет deploy-project, см. DEPLOY.md).
# Actions закреплены по SHA коммита (версия — в комментарии): подменённый тег не попадёт в сборку.
name: CI/CD

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/o-chernov/donseller

jobs:
  build:
    name: Сборка образа
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Вход в ghcr.io (только main)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка (в main — и публикация)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=LicenseRef-PolyForm-Shield-1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Деплой на сервер
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      packages: read
    steps:
      - name: deploy-project на сервере
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Нет digest образа"; exit 1; }
          install -d -m 700 ~/.ssh
          # Секреты могли прийти с переводами строк Windows (CRLF) — ssh их не прочитал бы
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts_deploy
          # Запрос: commit, digest, кто запустил. Токен реестра — в stdin
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -T \
            -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts_deploy" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "deploy@${DEPLOY_HOST}" "${GITHUB_SHA} ${DIGEST} ${GITHUB_ACTOR}"
